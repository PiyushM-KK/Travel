# The website's AI chat: Cloudflare Worker "hello-world" (https://hello-world.skyline-dev.workers.dev).
# Deployed by .github/workflows/chat-worker.yml after server/test-chat-worker.mjs passes; pasting the file into the
# Cloudflare dashboard still works as a fallback.
# The settings below match the live worker as Cloudflare's API reported it on 2026-10-06 (compatibility date 2026-07-01,
# no flags, workers.dev on, no routes, no cron, no observability), so a deploy changes the code and nothing else - with
# ONE deliberate change: preview URLs off (they were on). Every deploy would otherwise get its own public version URL
# that calls Claude with the live key and sits outside any rate rule written for the main URL (review, 2026-10-06);
# nothing uses them. The ANTHROPIC_API_KEY secret lives only in Cloudflare and is kept by every deploy.
name = "hello-world"
main = "anthropic-chat-worker.js"
compatibility_date = "2026-07-01"
workers_dev = true
preview_urls = false
# Upload the file exactly as written (it imports nothing): no bundler pass may rewrite its regular expressions or text.
no_bundle = true
# Keep any variable set in the dashboard (there are none today).
keep_vars = true

# Workers Logs stay off, as on the live worker (pinned so a deploy cannot turn them on or off by default).
[observability]
enabled = false
