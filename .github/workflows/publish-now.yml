# Run Skyline's normal publish pass NOW instead of waiting for the daily 15:30 UTC cron (owner 2026-10-28).
# It is the same endpoint the cron calls (api/cron-publish.js): it posts ONLY rows the owner already approved and
# that are due, with every publish guard unchanged. Manual only. The daily cron keeps running as before.
# The log is public: it prints counts of outcomes only (no ids, captions or links).
name: publish-now
on:
  workflow_dispatch:
    inputs:
      report_only:
        description: "true = skip publishing, only send the WhatsApp report of held/failed posts"
        required: false
        default: "false"
      requeue_canva_jpeg:
        description: "true = first re-encode approved Canva cards refused as PNG to JPEG and put them back to approved"
        required: false
        default: "false"
permissions:
  contents: read
concurrency:
  group: publish-now
  cancel-in-progress: false
jobs:
  requeue:
    if: ${{ inputs.requeue_canva_jpeg == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: social-automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Re-encode refused PNG Canva cards to JPEG (approved rows only)
        env:
          SOCIAL_CLIENT: skyline
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: node automation/requeue-canva-jpeg.js
  publish:
    needs: requeue
    if: ${{ always() && inputs.report_only != 'true' && needs.requeue.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish approved, due posts now
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -m 70 -o out.json -w "%{http_code}" -H "Authorization: Bearer ${CRON_SECRET}" "https://skyline-social-nine.vercel.app/api/cron-publish")
          echo "HTTP $code"
          jq -c '{ok, dryRun, outcomes: ([.. | objects | select(has("outcome")) | .outcome] | group_by(.) | map({(.[0]): length}) | add)}' out.json
          test "$code" = "200"
  report:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: social-automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Tell the owner on WhatsApp why any post did not go out (counts only here)
        env:
          SOCIAL_CLIENT: skyline
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: node automation/publish-report.js 3
